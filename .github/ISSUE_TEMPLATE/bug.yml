name: Something doesn't work
description: A hook, the command, a skill or an agent doesn't do what the README says.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, and everything the hook or Claude printed, as is.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Your .claude/dev-workflow.json
      description: The sections that matter here, or all of it.
      render: json
  - type: input
    id: system
    attributes:
      label: Your system
      placeholder: Windows 11 / macOS 15 on Apple Silicon / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: The plugin (/plugin, then the installed list), Claude Code (claude --version) and Node (node -v).
      placeholder: dev-workflow-core 2.0.1, Claude Code 2.1.300, Node 20.18
